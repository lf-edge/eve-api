syntax = "proto3";

package org.lfedge.eve.info;
option go_package  = "github.com/lf-edge/eve-api/go/info";
option java_package = "org.lfedge.eve.info";

import "google/protobuf/timestamp.proto";

// Describes an error that occurred while applying a configuration to the device.
message ErrorInfo {
  string description = 1;              // Human-readable description of the error.
  google.protobuf.Timestamp timestamp = 2;  // Time at which the error occurred.
  Severity severity = 3;               // Severity level of the error.
  repeated DeviceEntity entities = 4;  // Device entities referenced in the description or retry condition.
  string retry_condition = 5;          // Condition under which the operation may be retried.
  // Machine-parseable, namespaced error token, stable across EVE releases,
  // so the controller can react without parsing the description. Each code
  // has exactly one meaning; namespaces are extended additively. Empty when
  // the error has no structured code. Registered codes:
  //   cpu.policy.invalid            a CPU placement field the request cannot
  //                                 carry, a value out of range, or a
  //                                 combination this EVE does not implement
  //   cpu.policy.odd_vcpu           threads_per_core=2 with an odd vcpus
  //   cpu.topology.unsupported      the node cannot present the request:
  //                                 unknown topology, no two-thread core, or
  //                                 a hypervisor without per-vCPU placement
  //   cpu.isolation.unavailable     CPU_POLICY_ISOLATED on a node that
  //                                 isolates no CPU
  //   cpu.isolation.reserved_cpus   WARNING, on the ISOLATED pool: isolcpus
  //                                 covers CPUs reserved for EVE's services
  //   cpu.isolation.partial_core    WARNING, on the ISOLATED pool: isolcpus
  //                                 isolates some but not all threads of a
  //                                 core, which then serves no workload
  //   cpu.placement.insufficient    the workload does not fit, or fits only
  //                                 by leaving out a running workload
  //   cpu.placement.needs_repack    not started; fits once every workload
  //                                 carrying a repack code restarts at once
  //   cpu.placement.repack_advised  WARNING, running: part of a repack, as it
  //                                 runs on a worse placement than planned,
  //                                 holds CPUs the plan gives to another
  //                                 workload, or has an
  //                                 IO_PLACEMENT_HOUSEKEEPING that could not
  //                                 be served
  // EVE does not retry a refused workload; retry_condition says what has to
  // change.
  string error_code = 6;
}

// Severity tells the severity type
enum Severity {
  SEVERITY_UNSPECIFIED = 0; // severity unspecified
  SEVERITY_NOTICE = 1;      // severity notice
  SEVERITY_WARNING = 2;     // severity warning
  SEVERITY_ERROR = 3;       // severity error
}

// DeviceEntity contains the device entity details
message DeviceEntity {
  Entity entity = 1;           // entity type
  string entity_id = 2;        // entity uuid
  string entity_name = 3;      // entity name
}

// Entity contains the entity type
enum Entity {
  // Invalid Device Entity
  ENTITY_UNSPECIFIED = 0;
  // Base OS entity
  ENTITY_BASE_OS = 1;
  // System Adapter Entity
  ENTITY_SYSTEM_ADAPTER = 2;
  // Vault Entity
  ENTITY_VAULT = 3;
  // Attestation Entity
  ENTITY_ATTESTATION = 4;
  // App Instance Entity
  ENTITY_APP_INSTANCE = 5;
  // Port Entity
  ENTITY_PORT = 6;
  // Network Entity
  ENTITY_NETWORK = 7;
  // Network Instance Entity
  ENTITY_NETWORK_INSTANCE = 8;
  // ContentTree Entity
  ENTITY_CONTENT_TREE = 9;
  // Blob Entity
  ENTITY_CONTENT_BLOB = 10;
  // VOLUME Entity
  ENTITY_VOLUME = 11;
}
