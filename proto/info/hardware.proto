syntax = "proto3";

package org.lfedge.eve.info;

option go_package = "github.com/lf-edge/eve-api/go/info";
option java_package = "org.lfedge.eve.info";

message USBAddress {
        // https://elixir.bootlin.com/linux/v6.16.9/source/include/linux/usb.h#L451
        // https://github.com/gregkh/usbutils/blob/master/lsusb-t.c#L48
        uint32 bus = 1;
        // port like in the devpath; one way to see the devpath in the userspace is to
        // have a look in sysfs, f.e.:
        // /sys/devices/pci0000:00/0000:00:14.0/usb3/3-3/3-3.1/3-3.1.1/
        // "3-3.1.1" is bus number 3 and port 1.1
        // here the ports are concatenated with the parent ports
        // https://elixir.bootlin.com/linux/v6.16.9/source/drivers/usb/core/usb.c#L706
        string port = 2;
}

message BusParent {
        optional PCIAddress pci_parent = 1;
        optional USBAddress usb_parent = 2;
}

message USBDevice {
        reserved 8; // was acs_enabled
        optional BusParent parent = 1;

        // these are uint16, protobuf only supports from uint32
        // https://elixir.bootlin.com/linux/v6.16.9/source/include/linux/usb.h#L984
        uint32 vendor_id = 2;
        uint32 product_id = 3;

        USBAddress bus_port = 4;
        string driver = 5;      // kernel driver bound to this device
        uint32 class_id = 6;    // 3 bytes: (base_class, sub_class, protocol)
        // Optional: EVE's suggested assignment group for this device.
        // Controller may derive its own based on parent relationships.
        string suggested_assigngrp = 7;
}

message PCIAddress {
        // https://github.com/lyonel/lshw/blob/master/src/core/pci.cc#L223
        uint32 domain = 1;
        uint32 bus = 2;
        uint32 device = 3;
        uint32 function = 4;
}

message PCIDevice {
        optional PCIAddress parent_pci_device_address = 1;
        string driver = 2;
        PCIAddress address = 3;
        // https://elixir.bootlin.com/linux/v6.16.9/source/include/linux/pci.h#L347
        // using uint32 because uint16 is not available in protobuf
        uint32 vendor_id = 4;
        uint32 device_id = 5;
        uint32 revision = 6;
        uint32 subsystem_id = 7;
        uint32 class_id = 8; // 3 bytes: (base,sub,prog-if)
        uint64 subclass_id = 9;
        // IOMMU group names apparently are strings: https://elixir.bootlin.com/linux/v6.16.9/source/drivers/iommu/iommu.c#L1101
        string iommu_group = 10;
        // NUMA node this device's DMA/interrupts are local to, from sysfs
        // /sys/bus/pci/devices/<addr>/numa_node. -1 means the platform does
        // not report an affinity. Unset means EVE did not populate it.
        // Cross-references CPU.numa_node in CPUInfo, enabling NUMA-local
        // placement of a workload relative to its passthrough device.
        optional int32 numa_node = 11;
        // Logical CPU ids local to this device, from sysfs local_cpulist.
        // Cross-references CPU.id in CPUInfo.
        repeated uint32 local_cpu_ids = 12;
}

message SerialPort {
        optional BusParent parent = 1;

        string ioport_range = 2;  // I/O port range, e.g. "03f8-03ff"
        uint64 irq = 3;

        // f.e. /dev/ttyS0
        string devpath = 4;
}

message CANDevice {
        optional BusParent parent = 1;
        string ifname = 2;
}

enum NetworkDeviceType {
        NETWORK_DEVICE_TYPE_UNKNOWN  = 0;
        NETWORK_DEVICE_TYPE_ETHERNET = 1;   // PhyIoNetEth
        NETWORK_DEVICE_TYPE_WIFI     = 5;   // PhyIoNetWLAN
        NETWORK_DEVICE_TYPE_WWAN     = 6;   // PhyIoNetWWAN (Cellular)
        NETWORK_DEVICE_TYPE_ETH_PF   = 11;  // PhyIoNetEthPF (SR-IOV Physical Function)
        NETWORK_DEVICE_TYPE_ETH_VF   = 12;  // PhyIoNetEthVF (SR-IOV Virtual Function)
}

message NetworkDevice {
        optional BusParent parent = 1;

        string ifname = 2;
        NetworkDeviceType type = 3;

        string mac_address = 4; // e.g. "00:11:22:33:44:AA"
        uint32 speed_mbps = 5;  // link speed if known
}

message BIOS {
        string vendor = 1;
        string version = 2;
        // Curated BIOS attributes; not a full dump.
        map<string,string> attributes = 1000;
}

// CoreClass distinguishes core types on heterogeneous (hybrid) CPUs,
// e.g. Intel P/E cores or ARM big.LITTLE. Homogeneous parts report
// CORE_CLASS_UNSPECIFIED for all cores.
enum CoreClass {
        CORE_CLASS_UNSPECIFIED = 0;
        CORE_CLASS_PERFORMANCE = 1; // e.g. Intel P-core, ARM "big"
        CORE_CLASS_EFFICIENCY = 2;  // e.g. Intel E-core, ARM "LITTLE"
        CORE_CLASS_LOW_POWER = 3;   // e.g. Intel LP E-core
}

// CacheLevel identifies a CPU cache level for CacheDomain.
enum CacheLevel {
        CACHE_LEVEL_UNSPECIFIED = 0;
        CACHE_LEVEL_L1D = 1; // level-1 data cache
        CACHE_LEVEL_L1I = 2; // level-1 instruction cache
        CACHE_LEVEL_L2 = 3;
        CACHE_LEVEL_L3 = 4;
}

// One entry per logical CPU (SMT thread) — the schedulable unit.
// The topology coordinates (socket/core/NUMA/cache ids) are opaque
// grouping keys: equal values mean "same domain"; the values are not
// guaranteed contiguous or zero-based. Logical CPUs sharing
// (socket_id, core_id) are SMT siblings of one physical core.
message CPU {
        string model = 1;
        string vendor = 2;          // e.g. "GenuineIntel"
        uint32 id = 3;              // logical CPU id
        uint64 freq = 4;            // nominal frequency
        uint32 socket_id = 5;       // physical package (socket)
        uint32 core_id = 6;         // physical core within the socket
        uint32 numa_node = 7;       // NUMA node the CPU belongs to
        uint32 l2_id = 8;           // L2 cache domain id
        uint32 l3_id = 9;           // L3 cache domain id
        CoreClass core_class = 10;  // P/E/LP class on hybrid parts
        uint64 base_freq_khz = 11;  // base frequency, kHz
        uint64 max_freq_khz = 12;   // max (turbo) frequency, kHz
}

// CacheDomain describes one cache instance and the logical CPUs sharing
// it — the cache→cores linkage (values of CPU.id). Note that on some
// parts a cache domain spans multiple physical cores that are NOT SMT
// siblings (e.g. an Intel E-core module shares one L2 across four
// distinct cores); sibling grouping must use (socket_id, core_id), never
// a cache id.
message CacheDomain {
        CacheLevel level = 1;
        uint64 size_bytes = 2;
        // Logical CPU ids (CPU.id) sharing this cache instance.
        repeated uint32 cpu_ids = 3;
        // Domain id as reported by the platform; opaque grouping key,
        // matching CPU.l2_id / CPU.l3_id for the respective level.
        uint32 id = 4;
}

// CPUCapabilities reports CPU-hardware (silicon) resource-control
// features. Kernel/boot-level facts are NOT CPU properties and are
// reported separately in NodeCapabilities.
message CPUCapabilities {
        bool rdt_l3_cat = 1; // Intel RDT L3 cache allocation available
        bool rdt_mba = 2;    // Intel RDT memory-bandwidth allocation available
        uint32 num_clos = 3; // number of RDT classes of service (if rdt_*)
}

message CPUInfo {
        repeated CPU cpus = 1;
        // Cache domains with their cache→cores linkage.
        repeated CacheDomain caches = 2;
        CPUCapabilities capabilities = 3;
}

// NodeCapabilities reports granular kernel/boot-level facts relevant to
// workload CPU isolation. Deliberately low-level and factual: higher-level
// notions (e.g. which isolation tier is achievable for a given workload
// type) are derived by the consumer from these ingredients rather than
// precomputed by the node, so new ingredients can be added additively
// without changing the meaning of existing ones.
//
// Scope: this message reports only what the HARDWARE and the RUNNING KERNEL
// provide. What the EVE software itself is able to do with those facts is a
// separate concern and is reported through the device's software-capability
// channels (ZInfoDevice.optional_capabilities and ZInfoDevice.api_capability),
// so a hardware fact never has to change meaning when EVE gains or loses a
// feature. A consumer deciding whether a feature is offerable must consult
// both: hardware/kernel capable AND EVE software capable.
message NodeCapabilities {
        // Logical CPUs currently isolated from the scheduler by the
        // running kernel (isolcpus), from /sys/devices/system/cpu/isolated.
        repeated uint32 isolated_cpu_ids = 1;
        // Logical CPUs with the scheduler tick shed (nohz_full).
        repeated uint32 nohz_full_cpu_ids = 2;
        // Logical CPUs whose RCU callbacks are offloaded (rcu_nocbs).
        repeated uint32 rcu_nocbs_cpu_ids = 3;
}

message TPM {
  bool present            = 1;
  string manufacturer     = 2;  // e.g., "Infineon", "Nuvoton"
  string firmware_version = 3;  // e.g., "7.85"
  string spec_version     = 4;  // e.g., "2.0"
}

message HardwareInventory {
  reserved 12;  // was cpu_count

  repeated PCIDevice pci_devices = 3;
  repeated USBDevice usb_devices = 4;
  repeated SerialPort serial_devices = 5;
  repeated NetworkDevice network_devices = 6;
  repeated CANDevice can_devices = 7;

  BIOS bios = 8;
  CPUInfo cpu_info = 9;

  // ------------------------------------------------------------------
  // Node-level summary
  //  - system memory
  //  - system storage
  //  - amount of CPUs
  //  - availability of watchdog, TPM, status LED
  //  - kernel flavor & version
  //  - EVE platform
  // ------------------------------------------------------------------
  uint64 total_memory_bytes  = 10;  // total system RAM
  uint64 total_storage_bytes = 11;  // total non-removable storage

  bool watchdog_present      = 13;
  TPM tpm                    = 14;
  bool status_led_present    = 15;
  // Granular kernel/boot-level isolation facts (node, not CPU, properties).
  NodeCapabilities node_capabilities = 16;
  // Free-form extension for things not modeled yet.
  // New keys must be promoted to typed fields in a follow-up.
  map<string,string> misc = 1000;
}