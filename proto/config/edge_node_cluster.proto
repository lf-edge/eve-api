syntax = "proto3";

package org.lfedge.eve.config;
option go_package = "github.com/lf-edge/eve-api/go/config";
option java_package = "org.lfedge.eve.config";

import "evecommon/acipherinfo.proto";

enum ClusterType {
  CLUSTER_TYPE_UNSPECIFIED = 0;

  // cluster with only native kubernetes orchestration for user applications.
  // To be phased out; prefer CLUSTER_TYPE_REPLICATED_STORAGE with
  // EdgeNodeCluster.enable_native_k8s_orchestration = true.
  CLUSTER_TYPE_K3S_BASE = 1;

  // cluster with orchestration by EVE APIs for user applications
  CLUSTER_TYPE_REPLICATED_STORAGE = 2;

  // deprecated
  CLUSTER_TYPE_HA = 3 [deprecated = true];
}

enum HAScheme {
  HA_SCHEME_UNSPECIFIED = 0;

  // k3s embedded ETCD/raft HA scheme with 3, 5, etc control plane nodes
  HA_SCHEME_K3S_EMBEDDED = 1;
}

// LoadBalancer Service

message LoadBalancerInterface {
  string interface_name = 1;
  repeated string address_cidrs = 2;
}

message LoadBalancerService {
  repeated LoadBalancerInterface interfaces = 1;
}

// EdgeNodeClusterWitness configures a lightweight etcd-only 3rd voting
// member ("witness") for a 2-physical-node cluster, contributing only an
// etcd vote - no apiserver, no scheduler, no workloads, no Kubernetes Node
// object. Presence of this message (non-empty witness_ip) enables witness
// mode; there is no separate enable flag. The witness always co-locates
// with whichever device currently owns join_server_ip (the seed) - there
// is no separate placement field.
message EdgeNodeClusterWitness {
  // Virtual IP the witness's etcd binds to on cluster_interface. Must fall
  // inside EdgeNodeCluster.cluster_ip_prefix's subnet and must not collide
  // with any physical member's IP.
  string witness_ip = 1;
}

message EdgeNodeCluster {
  // cluster name, in case it has multiple cluster on the same site
  string cluster_name = 1;

  // cluster UUID
  string cluster_id = 2;

  // Cluster-Interface, for example "mgmt0", this is the logicallabel of the physicalIO
  string cluster_interface = 3;

  // the 'cluster-prefix' IP address of the 'Cluster-Interface', 10.244.244.2/28
  string cluster_ip_prefix = 4;

  // This device is an 'Agent' node
  bool is_worker_node = 5;

  // Server IP address to join the cluster. E.g. 10.244.244.1
  string join_server_ip = 6;

  // encrypted token string, use edge-node TPM to decrypt
  org.lfedge.eve.common.CipherBlock encrypted_cluster_token = 7;

  // Cluster Type for eve to determine component, app, and volume scheduling needs
  ClusterType cluster_type = 8;

  // Node Id for eve to disable all pod scheduling
  // EVE-OS should use this to set kubernetes node labels identifying
  // the tie-breaker node to the kubernetes scheduler.
  // Node labels are used in the node selector specification of
  // kubernetes objects to direct pod scheduling away from a
  // specific node due to node limitations.
  string tie_breaker_node_id = 9;

  // Never assigned, skipped accidentally.
  reserved 10;

  // High-availability scheme used by the cluster control plane.
  HAScheme ha_scheme = 11;

  // Optional load balancer service configuration.
  LoadBalancerService load_balancer_service = 12;

  // UUIDs of all designated master/control-plane nodes in the cluster,
  // as known to the controller. The elected kube-stats leader among
  // surviving EVE nodes uses this list to prune k8s Node objects (and
  // thereby k3s embedded etcd members) for masters the controller has
  // removed (e.g. after a "replace node" operation in the UI).
  // Workers are not listed here, and neither is the witness (see
  // EdgeNodeClusterWitness): it is never a master node.
  repeated string master_node_uuids = 13;

  // When true, EVE enables native Kubernetes orchestration for user
  // workloads in addition to EVE-API-managed scheduling. This provides
  // the same capability that CLUSTER_TYPE_K3S_BASE offered, but as an
  // opt-in flag on a CLUSTER_TYPE_REPLICATED_STORAGE cluster.
  // Requires cluster_type = CLUSTER_TYPE_REPLICATED_STORAGE.
  bool enable_native_k8s_orchestration = 14;

  // Witness (3rd etcd vote) configuration for a 2-physical-node cluster.
  // Unset/empty witness_ip means no witness runs.
  EdgeNodeClusterWitness witness = 15;

  // Controller-declared quorum-loss recovery trigger. Incrementing this
  // tells the device now named by join_server_ip to promote itself to
  // sole bootstrap via a forced etcd quorum reset. Every other
  // current/former member is not converged through this field at all:
  // the controller removes its cluster config outright, and it rejoins
  // fresh through the ordinary join workflow once reinstated. The
  // promoted device tracks the last generation it converged to and
  // takes no action when this value hasn't incremented from the last
  // recorded generation. Initial cluster formation is generation 0.
  // A device seeing this field for the first time (no locally-tracked
  // generation yet, e.g. a fresh join) records it as its baseline without
  // acting, the same way DeviceOpsCmd.counter is handled on first boot.
  uint32 quorum_recovery_generation = 16;
}
