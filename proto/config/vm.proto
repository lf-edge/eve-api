syntax = "proto3";

import "evecommon/evecommon.proto";

package org.lfedge.eve.config;
option go_package = "github.com/lf-edge/eve-api/go/config";
option java_package = "org.lfedge.eve.config";

// For now we need to tell the device which virtualization mode
// to use. Later we might use a single one for all VMs (on any particular
// ISA). If we end up keeping this we should make the names be less
// tied to a particular hypervisor.
enum VmMode {
  PV = 0;
  HVM = 1;
  Filler = 2; // PVH = 2;
  FML = 3; // Experimental machine learning mode
  NOHYPER = 4; // Do not use a hypervisor
  LEGACY = 5; // HVM, but with fully emulated legacy I/O (IDE disks and e1000 net)
}

// CpuPolicy selects the pool a workload's CPUs come from. Whether EVE pins
// each vCPU to one of those CPUs is a separate choice, VmConfig.pin_cpu; each
// field means the same whatever the other says.
enum CpuPolicy {
  // Not set: a controller that predates cpu_policy sends only pin_cpu, and
  // then pin_cpu=true means CPU_POLICY_DEDICATED and pin_cpu=false means
  // CPU_POLICY_HOUSEKEEPING. This is the only place a field's meaning depends on
  // another, and it exists only for such controllers.
  CPU_POLICY_UNSPECIFIED = 0;
  // The housekeeping pool, as the kernel calls the CPUs it keeps for the
  // system: the default pool for workloads as well as for EVE's own
  // processes, shared by everything that runs there (info
  // CPU_POOL_KIND_HOUSEKEEPING). It includes the CPUs EVE reserves for its
  // services (the lowest eve_max_vcpus CPUs, kernel command line, default 1):
  // housekeeping workloads run there too, but no CPU_POLICY_DEDICATED or
  // CPU_POLICY_ISOLATED workload gets them, so they are never in info
  // CPUPoolUtilization.free_cpu_ids.
  CPU_POLICY_HOUSEKEEPING = 1;
  // CPUs of the workload's own: no other workload runs on them
  // (info CPU_POOL_KIND_DEDICATED).
  CPU_POLICY_DEDICATED = 2;
  // CPUs of the workload's own that the running kernel isolates (isolcpus),
  // listed in info KernelCPUIsolation.isolated_cpu_ids (info
  // CPU_POOL_KIND_ISOLATED). EVE does not change the kernel command line: on
  // a node that isolates no CPU the request is refused (info
  // CPU_PLACEMENT_ERROR_ISOLATION_UNAVAILABLE), and when the isolated CPUs
  // are taken too (CPU_PLACEMENT_ERROR_INSUFFICIENT).
  CPU_POLICY_ISOLATED = 3;
}

// NumaPolicy expresses how strictly a workload's CPUs must stay within one
// NUMA node, as the running kernel reports NUMA; a kernel without NUMA
// information is one node, where every policy holds.
enum NumaPolicy {
  // Defaults to NUMA_POLICY_BEST_EFFORT.
  NUMA_POLICY_UNSPECIFIED = 0;
  // No NUMA consideration: CPUs may come from several nodes even when one
  // node could hold them.
  NUMA_POLICY_NONE = 1;
  // One NUMA node if any has room; otherwise CPUs from several nodes.
  NUMA_POLICY_BEST_EFFORT = 2;
  // One NUMA node, or the request is refused.
  NUMA_POLICY_SINGLE_NUMA_NODE = 3;
}

// IoPlacement selects where a VM's non-vCPU QEMU threads (emulator, main
// loop, iothreads) run. A container has no such threads.
enum IoPlacement {
  // Defaults to IO_PLACEMENT_DEDICATED.
  IO_PLACEMENT_UNSPECIFIED = 0;
  // The threads stay on the workload's own CPUs.
  IO_PLACEMENT_DEDICATED = 1;
  // The threads run on the CPUs reserved for EVE, off the workload's own
  // CPUs, so device emulation does not take cycles from busy vCPUs; on a node
  // that reserves none, on HOUSEKEEPING CPUs no workload is planned onto. A
  // node with no such CPU refuses the workload (info
  // CPU_PLACEMENT_ERROR_INSUFFICIENT).
  IO_PLACEMENT_HOUSEKEEPING = 2;
}

// Boot mechanisms supported by the BIOS of the Virtual Machine
enum VmBootMode {
  VM_BOOT_MODE_UNSPECIFIED = 0; // Boot mode not specified, use default
  VM_BOOT_MODE_LEGACY = 1; // Legacy BIOS, MBR support only
  VM_BOOT_MODE_UEFI = 2; // UEFI BIOS
}

message VmConfig {
  string kernel = 1;
  string ramdisk = 2;
  // in kbytes; rounded up to Mbytes for xen
  uint32 memory = 3;
  // in kbytes; xen only, default equal to 'memory', so no ballooning
  uint32 maxmem = 4;
  // The amount of the VCPUs in the VM.
  uint32 vcpus = 5;
  // In the case of the Xen hypervisor - the maximal amount of the VCPUs
  // available to the VM. Can be greater than `vcpus` (the VCPUs online on the
  // VM start). If the field is not set, it is initialized by EVE to the value
  // in the `vcpus` field.
  uint32 maxcpus = 6;
  string rootdev = 7;
  string extraargs = 8;
  string bootloader = 9;
  // Currently is not handled by EVE, and superseded — do not build on it.
  // CPU mask of the CPUs assigned to the VM. Represented in the form
  // "d[[,-]d]*". E.g. "0-2" or "0-2,5,6". CPUs start with 0. For example, the
  // mask "0,3" would mean that only physical CPUs 0 and 3 are available for
  // the VM.
  //
  // EVE has never parsed this field, and it is not planned to: naming concrete
  // host CPUs is the device's responsibility, not the controller's. A workload
  // expresses *what it needs* through the CPU placement policy below
  // (cpu_policy and friends) and the device selects cores that satisfy it,
  // topology-aware. Use cpu_policy instead.
  string cpus = 10 [deprecated = true];
  string devicetree = 11;
  repeated string dtdev = 12;
  repeated uint32 irqs = 13;
  repeated string iomem = 14;
  VmMode virtualizationMode = 15;
  // Enable VNC access to the edge application
  bool enable_vnc = 16;
  uint32 vncDisplay = 17;
  string vncPasswd = 18;
  // Change of the 'disable logs' field can be handled without VM reboot
  bool disableLogs = 19;
  // Whether EVE pins each vCPU of the VM to its own CPU of the pool chosen by
  // cpu_policy: one vCPU, one host CPU. false: EVE pins nothing, and the
  // workload's threads run on the pool's CPUs as the kernel or the workload
  // itself places them. A container has no vCPUs: pin_cpu=true on a container
  // is refused (info CPU_PLACEMENT_ERROR_POLICY_INVALID).
  //
  // With cpu_policy unset (a controller that predates it), pin_cpu=true means
  // CPU_POLICY_DEDICATED; see CpuPolicy.
  bool pin_cpu = 20;
  // Maximum amount of memory in kbytes allowed for VM monitor to occupy,
  // aka "overhead". E.g. for the qemu-kvm hypervisor the memory limit
  // for one VM instance (guest RAM + VM monitor) is set according to the
  // following equation: `memory` + `vmm_maxmem`
  uint32 vmm_maxmem = 21;
  // Enable VNC access to the shim VM harboring the edge application (for containers only)
  bool enable_vnc_shim_vm = 22;
  // Boot mode: Legacy or UEFI
  VmBootMode boot_mode = 23;
  // Enables enforcement of user-defined ordering for network interfaces.
  // This applies to both virtual interfaces (specified in the "AppInstanceConfig.interfaces" list)
  // and directly assigned network adapters (specified in the "AppInstanceConfig.adapters" list
  // as items of type "PhyIoNetEth", "PhyIoNetWLAN", "PhyIoNetWWAN", and "PhyIoNetEthVF").
  // Note: Older versions of EVE may not support enforcing the user-defined order
  // of application network interfaces. The controller can check
  // "ZInfoDevice.api_capability" to verify if the configured device supports the
  // API capability "API_CAPABILITY_ENFORCED_NET_INTERFACE_ORDER".
  // Please beware that EVE's ability to influence the order of VM application interfaces
  // is limited. Depending on the application's operating system, achieving the desired network
  // interface order might not be possible.
  bool enforce_network_interface_order = 24;
  // The app should receive the Windows license embedded in ACPI tables
  bool enable_oem_win_license_key = 25;
  // Disable vTPM for the VM, this defaults to false according to the
  // proto3 specification.
  bool disable_vtpm = 26;
  // Boot order configuration for this VM.
  // Controls boot device priority, particularly for USB devices.
  //
  // Priority hierarchy (highest to lowest):
  //   1. LPS API (/api/v1/app-boot-config) - if LPS has a cached config for the app
  //   2. This field (boot_order) - if not BOOT_ORDER_UNSPECIFIED
  //   3. Device property (app.boot.order) - device-wide default
  //
  // Note: LPS config is cached and persisted to disk. This allows boot order
  // to be applied immediately after EVE reboot, before LPS VM is available.
  // If LPS returns 404, the cache is cleared and Controller/Device settings apply.
  // See PROFILE.md for detailed LPS response handling.
  //
  // The setting is passed to OVMF via fw_cfg "opt/eve.bootorder" when the VM starts.
  // Changes take effect on the next VM restart.
  org.lfedge.eve.common.BootOrder boot_order = 27;

  // ------------------------------------------------------------------
  // CPU placement.
  //
  // The controller states what a workload needs; the device picks the
  // concrete host CPUs. Two independent choices: cpu_policy picks the pool,
  // pin_cpu (field 20) whether EVE pins each vCPU. The fields below refine a
  // CPU_POLICY_DEDICATED or CPU_POLICY_ISOLATED request. Each field means the
  // same whatever the others say. A request the device cannot serve as sent,
  // including a combination this EVE does not implement, is refused, and the
  // workload's info ZInfoApp.cpu_placement_error says why; nothing is
  // reinterpreted or silently dropped.
  //
  // A workload with cpu_policy unset and pin_cpu false runs in the
  // housekeeping pool, as before these fields existed.
  //
  // The controller MUST NOT send the fields below (cpu_policy,
  // full_pcpus_only, threads_per_core, numa_policy, io_placement: fields
  // 28-32) unless
  //  1. "ZInfoDevice.optional_capabilities.cpu_placement" is set: the node
  //     places CPUs. No other node serves them as described here: an EVE
  //     that predates them, EVE-k, or a node whose CPU topology EVE could not
  //     read;
  //  2. for CPU_POLICY_ISOLATED, HardwareInventory.kernel_cpu_isolation
  //     .isolated_cpu_ids is not empty.
  //
  // pin_cpu predates these fields, and a controller may send it to any node.
  // Where cpu_placement is set, pin_cpu=true with cpu_policy unset means
  // CPU_POLICY_DEDICATED, pinned. Where it is not, pin_cpu=true on a VM keeps
  // the meaning it had before these fields: the VM gets as many CPUs of its
  // own as it has vCPUs, with no regard to cores or NUMA (on EVE-k, KubeVirt's
  // dedicated CPU placement). An EVE that knows these fields refuses it only
  // on a node whose CPU topology it could not read (info
  // CPU_PLACEMENT_ERROR_TOPOLOGY_UNSUPPORTED).
  // ------------------------------------------------------------------

  // The pool the workload's CPUs come from; see CpuPolicy.
  CpuPolicy cpu_policy = 28;
  // Whole physical cores: no other workload runs on any SMT sibling of the
  // workload's cores. Requires CPU_POLICY_DEDICATED or CPU_POLICY_ISOLATED.
  // Without it, CPUs are taken one logical CPU at a time and a physical core
  // may be shared with another workload. Mirrors the Kubernetes CPU Manager
  // "full-pcpus-only" option.
  bool full_pcpus_only = 29;
  // How many SMT siblings of each core the workload uses; requires
  // full_pcpus_only. 2, also when unset: both siblings (a VM sees threads=2,
  // and vcpus must be even, or it is refused: info
  // CPU_PLACEMENT_ERROR_ODD_VCPU). 1: one thread per core, the sibling held
  // idle for the workload (a VM sees threads=1). Any other value is refused
  // (CPU_PLACEMENT_ERROR_POLICY_INVALID). On a node with no two-thread core
  // a 2 is refused (CPU_PLACEMENT_ERROR_TOPOLOGY_UNSUPPORTED); the controller
  // sees that in the inventory and sends 1. A VM is shown a
  // sockets/cores/threads topology that matches its host CPUs.
  uint32 threads_per_core = 30;
  // NUMA confinement; see NumaPolicy. Requires full_pcpus_only.
  NumaPolicy numa_policy = 31;
  // Where a VM's non-vCPU QEMU threads run; see IoPlacement. Requires
  // full_pcpus_only; refused on a container.
  IoPlacement io_placement = 32;
}
